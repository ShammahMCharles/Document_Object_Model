<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <script src="./script.js" defer></script>
    <title>Document</title>
</head>
<body>
    <div class="header">
  <h2>Blog Name</h2>
</div>

<div class="row">
  <div class="leftcolumn">
    <main class="container">
     
      <h4>Home</h4>
      <header class="new-message">
        <div class="user-img"></div>

        <form id="add-message">
          <input id="message-title" 
          type="text" 
          placeholder="Title" required>

          <textarea id="message-content" 
          placeholder="What's on your mind?" 
          cols="20" rows="6" required></textarea>

          <button type="submit" class="post-btn" disabled>Post</button>
        </form>
      </header>
      <ul id="messages-list" class="messages-lists">
        <li class="messages-list">
          <div class="message-header">
            <div class="user-img"></div>
            <h3 class="message-title">Sample Title</h3>
          </div>
          <p class="message-content">Sample content for the message.</p>

        </li>
      </ul>
    </main>

  </div>
  <div class="rightcolumn">
    <div class="card">
      <h2>About Us</h2>
      <div class="fakeimg" style="height:100px;">Image</div>
      <p>Some text about us..</p>
    </div>
    <div class="card">
      <h3>Who to Follow</h3>
      <div class="fakeimg">Image</div><br>
      <div class="fakeimg">Image</div><br>
      <div class="fakeimg">Image</div>
    </div>
    <div class="card">
      <h3>Follow Us</h3>
      <p>Some text..</p>
    </div>
  </div>
</div>

</body>
</html>
